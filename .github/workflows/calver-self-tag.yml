name: CalVer Self Tag

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Apply CalVer tags
        shell: bash
        run: ./calver --auto --backfill-all --backfill-base-branch= --apply --push
