name: CalVer Tagging
on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
concurrency: tag-scripts
jobs:
  apply:
    runs-on: ubuntu-latest
    name: Tag revision
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Version
        uses: acrois/calver@trunk